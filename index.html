
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个网站</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #202938;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      background: white;
      padding: 55px 35px;
      border-radius: 20px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 10px 40px #00000010;
    }

    h1 {
      color: #635bdb;
      font-size: 36px;
    }

    p {
      color: #64748b;
      line-height: 1.8;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 28px;
      background: #635bdb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>欢迎来到我的第一个网站！</h1>
    <p>这是我使用 VS Code 编写的第一个网站。</p>
    <p>我正在学习 Git、GitHub 和 Vercel。</p>
    <a class="button" href="https://github.com/void6728/my-first-project">
      访问我的 GitHub
    </a>
  </div>
</body>
</html>
